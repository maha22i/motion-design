<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: #09090b;
          overflow: hidden;
          font-family: Inter, system-ui, sans-serif;
        }

        #feat-bg-grid {
          position: absolute;
          inset: 0;
          background-image:
            linear-gradient(rgba(99, 102, 241, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(99, 102, 241, 0.05) 1px, transparent 1px);
          background-size: 60px 60px;
        }

        #feat-heading {
          font-size: 56px;
          font-weight: 700;
          letter-spacing: -0.03em;
          margin-bottom: 64px;
          color: #fafafa;
          z-index: 1;
        }

        #feat-cards {
          display: flex;
          gap: 32px;
          z-index: 1;
        }

        .feat-card {
          width: 380px;
          padding: 48px 36px;
          background: rgba(24, 24, 27, 0.8);
          border: 1px solid rgba(63, 63, 70, 0.5);
          border-radius: 20px;
          backdrop-filter: blur(8px);
        }

        .feat-icon-wrap {
          width: 64px;
          height: 64px;
          border-radius: 16px;
          display: flex;
          align-items: center;
          justify-content: center;
          margin-bottom: 24px;
          font-size: 28px;
        }

        #feat-card-1 .feat-icon-wrap { background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(99, 102, 241, 0.05)); color: #818cf8; }
        #feat-card-2 .feat-icon-wrap { background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(168, 85, 247, 0.05)); color: #c084fc; }
        #feat-card-3 .feat-icon-wrap { background: linear-gradient(135deg, rgba(236, 72, 153, 0.2), rgba(236, 72, 153, 0.05)); color: #f472b6; }

        .feat-card-title {
          font-size: 24px;
          font-weight: 600;
          color: #fafafa;
          margin: 0 0 12px 0;
        }

        .feat-card-desc {
          font-size: 16px;
          color: #a1a1aa;
          line-height: 1.6;
          margin: 0;
        }

        #feat-glow {
          position: absolute;
          width: 800px;
          height: 400px;
          background: radial-gradient(ellipse, rgba(99, 102, 241, 0.08), transparent 70%);
          bottom: 0;
          left: 50%;
          margin-left: -400px;
        }
      </style>

      <div id="root" data-composition-id="features" data-width="1920" data-height="1080" data-duration="8">
        <div id="feat-bg-grid"></div>
        <div id="feat-glow"></div>

        <h2 id="feat-heading">Powerful Features</h2>

        <div id="feat-cards">
          <div id="feat-card-1" class="feat-card">
            <div class="feat-icon-wrap"><span>&#9670;</span></div>
            <h3 class="feat-card-title">GSAP Animations</h3>
            <p class="feat-card-desc">Seekable timelines with full GSAP power. Frame-perfect rendering every time.</p>
          </div>

          <div id="feat-card-2" class="feat-card">
            <div class="feat-icon-wrap"><span>&#9679;</span></div>
            <h3 class="feat-card-title">Sub-Compositions</h3>
            <p class="feat-card-desc">Modular scenes you can reuse and remix. Build complex videos from simple parts.</p>
          </div>

          <div id="feat-card-3" class="feat-card">
            <div class="feat-icon-wrap"><span>&#9733;</span></div>
            <h3 class="feat-card-title">One-Click Render</h3>
            <p class="feat-card-desc">From HTML to MP4 in seconds. No plugins, no exports, just code to video.</p>
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        tl.fromTo("#feat-bg-grid", { opacity: 0 }, { opacity: 1, duration: 1, ease: "power2.out" }, 0);
        tl.fromTo("#feat-glow", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 1.5, ease: "power2.out" }, 0);

        tl.fromTo("#feat-heading", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.3);

        tl.fromTo("#feat-card-1", { opacity: 0, y: 60, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "back.out(1.2)" }, 0.8);
        tl.fromTo("#feat-card-2", { opacity: 0, y: 60, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "back.out(1.2)" }, 1.1);
        tl.fromTo("#feat-card-3", { opacity: 0, y: 60, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "back.out(1.2)" }, 1.4);

        tl.fromTo("#feat-card-1", { boxShadow: "0 0 0 rgba(99,102,241,0)" }, { boxShadow: "0 0 40px rgba(99,102,241,0.15)", duration: 0.8, ease: "power2.inOut", immediateRender: false }, 2.0);
        tl.fromTo("#feat-card-2", { boxShadow: "0 0 0 rgba(168,85,247,0)" }, { boxShadow: "0 0 40px rgba(168,85,247,0.15)", duration: 0.8, ease: "power2.inOut", immediateRender: false }, 2.3);
        tl.fromTo("#feat-card-3", { boxShadow: "0 0 0 rgba(236,72,153,0)" }, { boxShadow: "0 0 40px rgba(236,72,153,0.15)", duration: 0.8, ease: "power2.inOut", immediateRender: false }, 2.6);

        tl.fromTo("#feat-heading", { opacity: 1 }, { opacity: 0, duration: 0.4, immediateRender: false }, 7.0);
        tl.fromTo("#feat-card-1", { opacity: 1 }, { opacity: 0, y: -20, duration: 0.4, immediateRender: false }, 7.0);
        tl.fromTo("#feat-card-2", { opacity: 1 }, { opacity: 0, y: -20, duration: 0.4, immediateRender: false }, 7.1);
        tl.fromTo("#feat-card-3", { opacity: 1 }, { opacity: 0, y: -20, duration: 0.4, immediateRender: false }, 7.2);

        window.__timelines["features"] = tl;
      </script>
    </template>
  </body>
</html>
