<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: radial-gradient(ellipse at 50% 50%, #0f1b2e 0%, #0a0f1a 70%);
          overflow: hidden;
          font-family: Inter, system-ui, sans-serif;
        }

        #out-ring {
          position: absolute;
          width: 450px;
          height: 450px;
          border: 2px solid rgba(37, 99, 235, 0.12);
          border-radius: 50%;
        }

        #out-ring-2 {
          position: absolute;
          width: 280px;
          height: 280px;
          border: 1px solid rgba(6, 182, 212, 0.08);
          border-radius: 50%;
        }

        #out-logo-box {
          width: 100px;
          height: 100px;
          border-radius: 24px;
          background: linear-gradient(135deg, #2563eb, #06b6d4);
          display: flex;
          align-items: center;
          justify-content: center;
          margin-bottom: 32px;
          box-shadow: 0 0 80px rgba(37, 99, 235, 0.3);
          z-index: 1;
        }

        #out-logo-t {
          font-size: 52px;
          font-weight: 800;
          color: #fff;
        }

        #out-brand {
          font-size: 64px;
          font-weight: 700;
          color: #f1f5f9;
          letter-spacing: -0.03em;
          margin: 0;
          z-index: 1;
        }

        #out-tagline {
          font-size: 28px;
          color: #94a3b8;
          margin: 16px 0 0 0;
          z-index: 1;
        }

        #out-tagline-em {
          color: #38bdf8;
          font-weight: 600;
        }

        #out-url {
          font-size: 22px;
          color: #60a5fa;
          margin-top: 48px;
          font-weight: 600;
          letter-spacing: 0.02em;
          z-index: 1;
        }

        #out-line {
          width: 80px;
          height: 3px;
          background: linear-gradient(90deg, #2563eb, #06b6d4);
          margin-top: 32px;
          border-radius: 2px;
          z-index: 1;
        }

        .out-sparkle {
          position: absolute;
          width: 6px;
          height: 6px;
          background: #3b82f6;
          border-radius: 50%;
        }

        #out-sp-1 { top: 22%; left: 28%; }
        #out-sp-2 { top: 18%; right: 32%; }
        #out-sp-3 { bottom: 25%; left: 22%; }
        #out-sp-4 { bottom: 22%; right: 28%; }
      </style>

      <div id="root" data-composition-id="outro" data-width="1920" data-height="1080" data-duration="8">
        <div id="out-ring"></div>
        <div id="out-ring-2"></div>
        <div id="out-sp-1" class="out-sparkle"></div>
        <div id="out-sp-2" class="out-sparkle"></div>
        <div id="out-sp-3" class="out-sparkle"></div>
        <div id="out-sp-4" class="out-sparkle"></div>

        <div id="out-logo-box">
          <span id="out-logo-t">T</span>
        </div>

        <h2 id="out-brand">Teknosure</h2>
        <p id="out-tagline">Automatisez vos processus. <span id="out-tagline-em">Liberez votre potentiel.</span></p>

        <div id="out-line"></div>

        <p id="out-url">teknosure.com</p>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        tl.fromTo("#out-ring", { scale: 0, opacity: 0, rotation: -45 }, { scale: 1, opacity: 1, rotation: 0, duration: 1.2, ease: "power2.out" }, 0);
        tl.fromTo("#out-ring-2", { scale: 0, opacity: 0, rotation: 45 }, { scale: 1, opacity: 1, rotation: 0, duration: 1, ease: "power2.out" }, 0.3);

        tl.fromTo(".out-sparkle", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.3, stagger: 0.1, ease: "back.out(3)" }, 0.8);
        tl.fromTo(".out-sparkle", { y: 0 }, { y: -12, duration: 2, ease: "sine.inOut", stagger: { each: 0.2, repeat: 1, yoyo: true } }, 1.2);

        tl.fromTo("#out-logo-box", { scale: 0, rotation: -180 }, { scale: 1, rotation: 0, duration: 0.8, ease: "back.out(1.7)" }, 0.4);
        tl.fromTo("#out-logo-t", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 1.0);

        tl.fromTo("#out-brand", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.2);
        tl.fromTo("#out-tagline", { opacity: 0, y: 15 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.6);

        tl.fromTo("#out-line", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, 2.0);
        tl.fromTo("#out-url", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 2.4);

        tl.fromTo("#out-logo-box", { boxShadow: "0 0 40px rgba(37,99,235,0.2)" }, { boxShadow: "0 0 100px rgba(37,99,235,0.5)", duration: 1.2, ease: "sine.inOut", repeat: 1, yoyo: true, immediateRender: false }, 3.0);

        window.__timelines["outro"] = tl;
      </script>
    </template>
  </body>
</html>
