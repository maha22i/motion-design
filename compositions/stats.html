<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: linear-gradient(180deg, #09090b 0%, #0f0a1e 100%);
          overflow: hidden;
          font-family: Inter, system-ui, sans-serif;
        }

        #stats-heading {
          font-size: 48px;
          font-weight: 700;
          letter-spacing: -0.03em;
          color: #fafafa;
          margin-bottom: 64px;
        }

        #stats-row {
          display: flex;
          gap: 80px;
          margin-bottom: 80px;
        }

        .stat-item {
          text-align: center;
        }

        .stat-number {
          font-size: 80px;
          font-weight: 800;
          letter-spacing: -0.04em;
          margin: 0;
          line-height: 1;
        }

        #stats-num-1 .stat-number { color: #818cf8; }
        #stats-num-2 .stat-number { color: #c084fc; }
        #stats-num-3 .stat-number { color: #f472b6; }
        #stats-num-4 .stat-number { color: #34d399; }

        .stat-label {
          font-size: 18px;
          color: #797981;
          margin-top: 12px;
          text-transform: uppercase;
          letter-spacing: 0.1em;
          font-weight: 500;
        }

        #stats-bars {
          display: flex;
          align-items: flex-end;
          gap: 24px;
          height: 200px;
        }

        .stat-bar-wrap {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 12px;
        }

        .stat-bar {
          width: 64px;
          border-radius: 8px 8px 0 0;
        }

        #stats-bar-1 { height: 140px; background: linear-gradient(180deg, #818cf8, #4f46e5); }
        #stats-bar-2 { height: 180px; background: linear-gradient(180deg, #c084fc, #7c3aed); }
        #stats-bar-3 { height: 120px; background: linear-gradient(180deg, #f472b6, #db2777); }
        #stats-bar-4 { height: 160px; background: linear-gradient(180deg, #34d399, #059669); }
        #stats-bar-5 { height: 200px; background: linear-gradient(180deg, #fbbf24, #d97706); }

        .stat-bar-label {
          font-size: 14px;
          color: #52525b;
          font-weight: 500;
        }

        #stats-accent-line {
          position: absolute;
          top: 50%;
          left: 0;
          width: 100%;
          height: 1px;
          background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.2), transparent);
        }
      </style>

      <div id="root" data-composition-id="stats" data-width="1920" data-height="1080" data-duration="7">
        <div id="stats-accent-line"></div>

        <h2 id="stats-heading">By the Numbers</h2>

        <div id="stats-row">
          <div id="stats-num-1" class="stat-item">
            <p class="stat-number">10K+</p>
            <p class="stat-label">Projects</p>
          </div>
          <div id="stats-num-2" class="stat-item">
            <p class="stat-number">60fps</p>
            <p class="stat-label">Rendering</p>
          </div>
          <div id="stats-num-3" class="stat-item">
            <p class="stat-number">4K</p>
            <p class="stat-label">Resolution</p>
          </div>
          <div id="stats-num-4" class="stat-item">
            <p class="stat-number">0.5s</p>
            <p class="stat-label">Build Time</p>
          </div>
        </div>

        <div id="stats-bars">
          <div class="stat-bar-wrap">
            <div id="stats-bar-1" class="stat-bar"></div>
            <span class="stat-bar-label">Q1</span>
          </div>
          <div class="stat-bar-wrap">
            <div id="stats-bar-2" class="stat-bar"></div>
            <span class="stat-bar-label">Q2</span>
          </div>
          <div class="stat-bar-wrap">
            <div id="stats-bar-3" class="stat-bar"></div>
            <span class="stat-bar-label">Q3</span>
          </div>
          <div class="stat-bar-wrap">
            <div id="stats-bar-4" class="stat-bar"></div>
            <span class="stat-bar-label">Q4</span>
          </div>
          <div class="stat-bar-wrap">
            <div id="stats-bar-5" class="stat-bar"></div>
            <span class="stat-bar-label">Now</span>
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        tl.fromTo("#stats-accent-line", { scaleX: 0 }, { scaleX: 1, duration: 1.2, ease: "power2.inOut" }, 0);

        tl.fromTo("#stats-heading", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.2);

        tl.fromTo("#stats-num-1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.6);
        tl.fromTo("#stats-num-2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.8);
        tl.fromTo("#stats-num-3", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.0);
        tl.fromTo("#stats-num-4", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.2);

        tl.fromTo("#stats-num-1 .stat-number", { scale: 0.5 }, { scale: 1, duration: 0.4, ease: "back.out(2)" }, 0.7);
        tl.fromTo("#stats-num-2 .stat-number", { scale: 0.5 }, { scale: 1, duration: 0.4, ease: "back.out(2)" }, 0.9);
        tl.fromTo("#stats-num-3 .stat-number", { scale: 0.5 }, { scale: 1, duration: 0.4, ease: "back.out(2)" }, 1.1);
        tl.fromTo("#stats-num-4 .stat-number", { scale: 0.5 }, { scale: 1, duration: 0.4, ease: "back.out(2)" }, 1.3);

        tl.fromTo("#stats-bar-1", { scaleY: 0 }, { scaleY: 1, duration: 0.6, ease: "power2.out", transformOrigin: "bottom" }, 2.0);
        tl.fromTo("#stats-bar-2", { scaleY: 0 }, { scaleY: 1, duration: 0.6, ease: "power2.out", transformOrigin: "bottom" }, 2.2);
        tl.fromTo("#stats-bar-3", { scaleY: 0 }, { scaleY: 1, duration: 0.6, ease: "power2.out", transformOrigin: "bottom" }, 2.4);
        tl.fromTo("#stats-bar-4", { scaleY: 0 }, { scaleY: 1, duration: 0.6, ease: "power2.out", transformOrigin: "bottom" }, 2.6);
        tl.fromTo("#stats-bar-5", { scaleY: 0 }, { scaleY: 1, duration: 0.6, ease: "power2.out", transformOrigin: "bottom" }, 2.8);

        tl.fromTo(".stat-bar-label", { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.1 }, 3.0);

        tl.fromTo("#stats-heading", { opacity: 1 }, { opacity: 0, duration: 0.4, immediateRender: false }, 6.0);
        tl.fromTo("#stats-row", { opacity: 1 }, { opacity: 0, y: -20, duration: 0.4, immediateRender: false }, 6.0);
        tl.fromTo("#stats-bars", { opacity: 1 }, { opacity: 0, y: 20, duration: 0.4, immediateRender: false }, 6.2);

        window.__timelines["stats"] = tl;
      </script>
    </template>
  </body>
</html>
