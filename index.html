<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Motion Design Studio</title>
    <script src="node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      body {
        margin: 0;
        background: #09090b;
        color: #fafafa;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      [data-composition-id="root"] > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="root"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="35"
    >
      <!-- Scene 1: Intro — brand reveal + kinetic title -->
      <div
        id="el-intro"
        data-composition-id="intro"
        data-composition-src="compositions/intro.html"
        data-start="0"
        data-duration="7"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 2: Features — animated feature cards -->
      <div
        id="el-features"
        data-composition-id="features"
        data-composition-src="compositions/features.html"
        data-start="7"
        data-duration="8"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 3: Stats — counting numbers + animated bars -->
      <div
        id="el-stats"
        data-composition-id="stats"
        data-composition-src="compositions/stats.html"
        data-start="15"
        data-duration="7"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 4: Quote — animated testimonial -->
      <div
        id="el-quote"
        data-composition-id="quote"
        data-composition-src="compositions/quote.html"
        data-start="22"
        data-duration="6"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 5: Outro — CTA + closing -->
      <div
        id="el-outro"
        data-composition-id="outro"
        data-composition-src="compositions/outro.html"
        data-start="28"
        data-duration="7"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>

    <script>
      window.__timelines["root"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
