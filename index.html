<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Teknosure — Motion Design</title>
    <script src="node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      body {
        margin: 0;
        background: #0a0f1a;
        color: #f1f5f9;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      [data-composition-id="root"] > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-mz07"
      id="root"
      data-composition-id="root"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="62"
    >
      <!-- Scene 1: Hook — repetitive tasks pain point -->
      <div data-hf-id="hf-863w"
        id="el-intro"
        data-composition-id="intro"
        data-composition-src="compositions/intro.html"
        data-start="0"
        data-duration="8"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 2: Transition — what if? -->
      <div data-hf-id="hf-uu55"
        id="el-question"
        data-composition-id="question"
        data-composition-src="compositions/question.html"
        data-start="8"
        data-duration="5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 3: Brand reveal — Teknosure -->
      <div data-hf-id="hf-v8hu"
        id="el-reveal"
        data-composition-id="reveal"
        data-composition-src="compositions/reveal.html"
        data-start="13"
        data-duration="7"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 4: Automated workflow demo -->
      <div data-hf-id="hf-tjly"
        id="el-workflow"
        data-composition-id="workflow"
        data-composition-src="compositions/workflow.html"
        data-start="20"
        data-duration="10"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 5: Use cases grid -->
      <div data-hf-id="hf-nlc7"
        id="el-usecases"
        data-composition-id="usecases"
        data-composition-src="compositions/usecases.html"
        data-start="30"
        data-duration="8"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 6: Key metrics / benefits -->
      <div data-hf-id="hf-8pmn"
        id="el-benefits"
        data-composition-id="benefits"
        data-composition-src="compositions/benefits.html"
        data-start="38"
        data-duration="8"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 7: 3-step method -->
      <div data-hf-id="hf-roch"
        id="el-method"
        data-composition-id="method"
        data-composition-src="compositions/method.html"
        data-start="46"
        data-duration="8"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 8: Outro — CTA + closing -->
      <div data-hf-id="hf-nt5c"
        id="el-outro"
        data-composition-id="outro"
        data-composition-src="compositions/outro.html"
        data-start="54"
        data-duration="8"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["root"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
